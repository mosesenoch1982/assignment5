<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Nadu Police - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo-wrapper {
            margin-bottom: 15px;
        }
        .header-logo {
            width: 100px;
            height: auto;
        }
        h1 {
            color: #0b3c5d;
            font-size: 24px;
            margin-bottom: 8px;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h2 {
            color: #328cc1;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: normal;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #333333;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #328cc1;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0b3c5d;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #1d5f8a;
        }
        .forgot-password {
            display: block;
            text-align: right;
            font-size: 14px;
            color: #328cc1;
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
            color: #0b3c5d;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo-wrapper">
        <!-- Ensure tnlo.png is in the same directory of your GitHub repository -->
        <img src="tnlo.png" alt="Tamilnadu Police Logo" class="header-logo">
    </div>
    
    <h1>Tamilnadu Police</h1>
    <h2>Official Login Portal</h2>
    
    <form action="#" method="POST">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        
        <button type="submit">Login</button>
        
        <a href="#" class="forgot-password">Forgot Password?</a>
    </form>
</div>

</body>
</html>
